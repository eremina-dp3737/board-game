<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board Games</title>
    <script src="index.js" defer></script>
    <style>
      body{
        background-color: honeydew;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      h1{
        background-color: rgb(224, 203, 243);
        width: 450px;
        height: 70px;
        border-radius: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: aliceblue;
        font-family: Georgia, 'Times New Roman', Times, serif;
      }
      #gameList{
        background-color: rgb(224, 203, 243);
        border-radius: 20px;
        font-size: 25px;
        font-family: Georgia, 'Times New Roman', Times, serif;
        color: aliceblue;
        font-weight: bold;
        width: 410px;
        height: 110px;
        display: flex;
        justify-content: center;
        flex-direction: column;
        
      }
      .all {
        background-color: rgb(195, 231, 159);
        font-size: 25px;
        font-family: Georgia, 'Times New Roman', Times, serif;
        color: rgb(17, 128, 23);
        font-weight: bold;
        width: 450px;
        height: 250px;
        border-radius: 20px;
        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
        gap: 7px;
      }
      .knopki {
        display: flex;
        flex-direction: row;
      }
      button {
        width: 80px;
        height: 30px;
      }
      #gameSelect {
        width: 100px;
        height: 30px;
      }
      .tops{
        display: flex;
        flex-direction: row;
        gap: 5px;
        font-size: 15px;
      }
      
    </style>
</head>
<body>
    <h1>Прокат настольных игр</h1>
    <input type="checkbox" id="freeGamesCheckbox">
    <label for="freeGamesCheckbox">Показать только свободные</label>
    <p id="hint"></p>
    <div class="tops">
      <h2>Название игры</h2>
      <h2>Число игроков</h2>
    </div>
<ul id="gameList"></ul>
<div class="PushGame">
  <input id="InputTitle" type="text">
  <input id="InputPlayers" type="number">
  <button id="ButtonAdd">Добавить игру</button>
</div>
<div class="all">
<label for="gameSelect">Игра</label>
<select id="gameSelect">
  
</select>



<label for="borrowerName">Имя посетителя</label>
<div class="knopki">
<input id="borrowerName" type="text">
<button id="borrowButton" type="button">Выдать</button>
<button id="returnButton" type="button">Вернуть</button>
</div>
<p id="message"></p>
</div>

    
</body>
</html>
